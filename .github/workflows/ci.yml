name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  python:
    name: python pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install sdk + test deps
        # [test] extra 含 pytest / httpx2 与三个 Web 框架。框架必须硬装：中间件单测用
        # pytest.importorskip，缺框架会静默跳过 —— CI 全绿但中间件零覆盖。
        run: pip install -e 'python[test]'
      - name: pytest
        working-directory: python
        run: python -m pytest -q

  node:
    name: node test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci
        working-directory: node
        run: npm ci
      - name: npm test
        working-directory: node
        run: npm test

  java:
    name: java mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: mvn test
        working-directory: java
        run: mvn -B test
